<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adrián Garrido - Portfolio Analítico</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            background-color: #f0f4f8;
            /* Fondo claro de día */
            color: #111;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* --- HUD DE TELEMETRÍA (ESTILO PREMIUM CLARO) --- */
        .hud-element {
            position: fixed;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            padding: 15px;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        #sectors {
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 180px;
        }

        .sector {
            padding: 6px 12px;
            border-left: 3px solid #ccc;
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 1px;
            color: #888;
        }

        .sector.active {
            border-left-color: #00aa44;
            color: #00aa44;
            background: rgba(0, 170, 68, 0.05);
        }

        #telemetry {
            bottom: 20px;
            right: 20px;
            text-align: right;
            min-width: 160px;
            border-right: 3px solid #ff1801;
        }

        .speed {
            font-family: 'Courier New', Courier, monospace;
            font-size: 36px;
            font-weight: bold;
            color: #111;
        }

        #cam-toggle {
            top: 20px;
            right: 20px;
            cursor: pointer;
            background: #ff1801;
            color: white;
            border: none;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: background 0.2s;
            box-shadow: 0 4px 15px rgba(255, 24, 1, 0.3);
        }

        #cam-toggle:hover {
            background: #e01500;
        }

        #checkpoint-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            width: 90%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-top: 4px solid #ff1801;
            padding: 35px;
            border-radius: 8px;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            color: #222;
        }

        #checkpoint-panel.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        #cp-title {
            font-size: 18px;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-weight: 700;
            text-align: center;
        }

        #cp-desc {
            color: #444;
            font-size: 14px;
            line-height: 1.6;
        }

        .nav-hint {
            font-size: 11px;
            color: #ff1801;
            margin-top: 25px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <button id="cam-toggle" class="hud-element" onclick="toggleCamara()">Modo: Seguir Coche</button>

    <div id="sectors" class="hud-element">
        <div id="sec-q1" class="sector active">S1: NOTAS</div>
        <div id="sec-q2" class="sector">S2: MATEMÁTICAS</div>
        <div id="sec-q3" class="sector">S3: CODING</div>
        <div id="sec-q4" class="sector">S4: VOLUNTARIADO</div>
    </div>

    <div id="telemetry" class="hud-element">
        <div class="speed"><span id="kmh">0</span> <span
                style="font-size: 14px; font-family: sans-serif; color: #888;">KM/H</span></div>
        <div style="font-size: 10px; color: #666; letter-spacing: 1px; margin-bottom: 8px;">DRIVE: W / S</div>
        <div id="coords"
            style="font-size: 12px; color: #ff1801; font-family: 'Courier New', monospace; font-weight: bold; text-align: left; background: rgba(0,0,0,0.05); padding: 5px; border-radius: 4px;">
            X: 0.00<br>Y: 0.00<br>Z: 0.00
        </div>
    </div>

    <div id="checkpoint-panel">
        <h2 id="cp-title">INSIGHT</h2>
        <p id="cp-desc"></p>
        <div class="nav-hint">[ Mantén presionado W para continuar la carrera ]</div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- 1. CONFIGURACIÓN DE ESCENA (FANDO CLARO DE DÍA) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f4f8); // Color cielo/gris claro premium sin niebla

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // --- NUEVO: CONFIGURACIÓN DE COLOR Y TONE MAPPING ---
        renderer.outputEncoding = THREE.sRGBEncoding; // Colores vivos y correctos
        renderer.toneMapping = THREE.ACESFilmicToneMapping; // Efecto cinemático (sin quemar blancos)
        renderer.toneMappingExposure = 1.0;

        // --- NUEVO: ACTIVAR SOMBRAS ---
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Sombras con bordes suaves
        container.appendChild(renderer.domElement);

        // Configuración de OrbitControls para la cámara libre amarrada
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = true;
        controls.enabled = false; // Desactivado al inicio (el mouse no hace nada en modo seguir)

        let modoCamaraLibre = false;

        // --- 2. ILUMINACIÓN COMPLETA DE DÍA (SIN SECCIONES OSCURAS) ---
        // Luz ambiental: Ajustada al tone mapping
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        // Sol Principal (Luz direccional desde el frente-derecha)
        const sunLight1 = new THREE.DirectionalLight(0xffffff, 1.5); // Más brillo para el sol
        sunLight1.position.set(20, 40, 20);

        // Configuración de sombras del Sol
        sunLight1.castShadow = true;
        sunLight1.shadow.mapSize.width = 2048; // Alta resolución para sombras nítidas
        sunLight1.shadow.mapSize.height = 2048;
        sunLight1.shadow.camera.near = 0.5;
        sunLight1.shadow.camera.far = 150;
        const d = 60; // Área que cubre la cámara de sombras ortográfica
        sunLight1.shadow.camera.left = -d;
        sunLight1.shadow.camera.right = d;
        sunLight1.shadow.camera.top = d;
        sunLight1.shadow.camera.bottom = -d;
        sunLight1.shadow.bias = -0.0005; // Evita artefactos gráficos en las sombras
        scene.add(sunLight1);

        // Luz de Relleno: Suavizamos la sombra opuesta (sin proyectar sombra doble)
        const sunLight2 = new THREE.DirectionalLight(0x90b0d0, 0.5); // Un tono ligeramente azulado como reflejo del cielo
        sunLight2.position.set(-20, 30, -20);
        scene.add(sunLight2);

        // --- 3. TRAZADO DE LA RUTA ---
        // Pon aquí tus coordenadas obtenidas con la barra espaciadora
        const trackCurve = new THREE.CatmullRomCurve3([

            new THREE.Vector3(0.100, 1.330, -2.290),
            new THREE.Vector3(0.100, 1.490, -2.670),
            new THREE.Vector3(0.100, 1.600, -3.030),
            new THREE.Vector3(0.100, 1.680, -3.310),
            new THREE.Vector3(0.100, 1.750, -3.570),
            new THREE.Vector3(0.100, 1.810, -3.900),
            new THREE.Vector3(0.100, 1.850, -4.190),
            new THREE.Vector3(0.100, 1.860, -4.480),
            new THREE.Vector3(0.100, 1.860, -6.800),
            new THREE.Vector3(0.100, 1.850, -7.140),
            new THREE.Vector3(0.100, 1.790, -7.440),
            new THREE.Vector3(0.100, 1.730, -7.780),
            new THREE.Vector3(0.100, 1.650, -8.100),
            new THREE.Vector3(0.100, 1.550, -8.400),
            new THREE.Vector3(0.100, 1.440, -8.690),
            new THREE.Vector3(0.100, 1.320, -9.020),
            new THREE.Vector3(0.100, 1.180, -9.360),
            new THREE.Vector3(0.100, 1.050, -9.710),
            new THREE.Vector3(0.100, 0.940, -10.020),
            new THREE.Vector3(0.100, 0.830, -10.340),
            new THREE.Vector3(0.100, 0.730, -10.660),
            new THREE.Vector3(0.100, 0.660, -10.980),
            new THREE.Vector3(0.100, 0.610, -11.300),
            new THREE.Vector3(0.100, 0.590, -11.630),
            new THREE.Vector3(0.100, 0.590, -11.990),
            new THREE.Vector3(0.100, 0.590, -17.060),
            new THREE.Vector3(0.860, 0.590, -18.840),
            new THREE.Vector3(2.660, 0.590, -19.520),
            new THREE.Vector3(4.410, 0.590, -18.820),
            new THREE.Vector3(5.150, 0.590, -17.090),
            new THREE.Vector3(5.150, 0.590, -13.650),
            new THREE.Vector3(5.920, 0.590, -11.950),
            new THREE.Vector3(7.680, 0.590, -11.250),
            new THREE.Vector3(10.980, 0.590, -11.250),
            new THREE.Vector3(12.740, 0.590, -10.500),
            new THREE.Vector3(13.490, 0.590, -8.750),
            new THREE.Vector3(14.150, 0.590, -5.530),
            new THREE.Vector3(12.840, 0.590, -0.720),
            new THREE.Vector3(13.510, 0.590, 3.970),
            new THREE.Vector3(12.730, 0.590, 5.710),
            new THREE.Vector3(10.930, 0.590, 6.400),
            new THREE.Vector3(4.420, 0.590, 6.400),
            new THREE.Vector3(4.170, 0.630, 6.400),
            new THREE.Vector3(3.910, 0.700, 6.390),
            new THREE.Vector3(3.640, 0.780, 6.390),
            new THREE.Vector3(3.380, 0.890, 6.390),
            new THREE.Vector3(3.070, 1.050, 6.390),
            new THREE.Vector3(2.790, 1.180, 6.390),
            new THREE.Vector3(2.570, 1.300, 6.390),
            new THREE.Vector3(2.290, 1.490, 6.390),
            new THREE.Vector3(2.090, 1.680, 6.390),
            new THREE.Vector3(-2.100, 3.260, 6.390),
            new THREE.Vector3(-6.880, 1.700, 6.390),
            new THREE.Vector3(-7.140, 1.480, 6.390),
            new THREE.Vector3(-7.390, 1.310, 6.390),
            new THREE.Vector3(-7.670, 1.170, 6.390),
            new THREE.Vector3(-8.010, 1.000, 6.390),
            new THREE.Vector3(-8.440, 0.820, 6.390),
            new THREE.Vector3(-8.690, 0.730, 6.390),
            new THREE.Vector3(-8.940, 0.670, 6.390),
            new THREE.Vector3(-9.220, 0.620, 6.390),
            new THREE.Vector3(-12.880, 0.620, 6.390),
            new THREE.Vector3(-14.660, 0.620, 5.660),
            new THREE.Vector3(-15.420, 0.620, 3.910),
            new THREE.Vector3(-14.640, 0.620, 2.110),
            new THREE.Vector3(-12.880, 0.620, 1.330),
            new THREE.Vector3(-7.440, 0.620, 1.330),
            new THREE.Vector3(-5.700, 0.620, 2.080),
            new THREE.Vector3(-4.970, 0.620, 3.840),
            new THREE.Vector3(-4.970, 0.620, 14.270),
            new THREE.Vector3(-4.180, 0.620, 16.020),
            new THREE.Vector3(-2.390, 0.620, 16.770),
            new THREE.Vector3(-0.610, 0.620, 16.030),
            new THREE.Vector3(0.110, 0.620, 14.260),
            new THREE.Vector3(0.100, 0.600, 6.000),
        ]);
        trackCurve.closed = false;

        /*      const puntosCurva = trackCurve.getPoints(500); // 100 puntos de resolución
                const geometriaCurva = new THREE.BufferGeometry().setFromPoints(puntosCurva);
                const materialCurva = new THREE.LineBasicMaterial({ color: 0xff0000, linewidth: 2 });
                const lineaCurva = new THREE.Line(geometriaCurva, materialCurva);
                scene.add(lineaCurva);
        */
        // --- 4. DATA DE INSIGHTS ---
        const checkpoints = [
            { progresoMin: 0.20, progresoMax: 0.25, titulo: "S1: THE HORIZONTAL ANCHOR", desc: "Top grades are often seen as an individual race, but earning the National Flag Bearer distinction taught me about collective slipstream...", sector: "q1" },
            { progresoMin: 0.45, progresoMax: 0.50, titulo: "S2: THE ARCHITECTURE OF FAILURE", desc: "In competitive mathematics, losing was my default setting for years. However, data analysis taught me that friction is mandatory for acceleration...", sector: "q2" },
            { progresoMin: 0.68, progresoMax: 0.73, titulo: "S3: BENDING THE FRAMEWORKS", desc: "I don't write code to test frameworks; I bend technology to solve systemic friction...", sector: "q3" },
            { progresoMin: 0.88, progresoMax: 0.93, titulo: "S4: THE HUMAN TELEMETRY", desc: "Volunteering is where abstract logic meets raw human telemetry. Engineering without empathy is just math...", sector: "q4" }
        ];

        // --- 5. VARIABLES DE JUEGO Y CONTENEDOR DE GIRO ---
        let grupoCoche = new THREE.Group(); // El contenedor que moveremos por la pista
        scene.add(grupoCoche);

        // --- MARCADOR VISUAL DEL ORIGEN (El punto que define la coordenada) ---
        /*        const marcadorOrigen = new THREE.Mesh(
                    new THREE.SphereGeometry(0.25, 16, 16),
                    new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true })
                );
                grupoCoche.add(marcadorOrigen); // Esta esfera verde marca el (0,0,0) local del coche
        
                const ejesOrigen = new THREE.AxesHelper(1.5);
                grupoCoche.add(ejesOrigen); // Ejes: Rojo(X), Verde(Y), Azul(Z) desde el centro exacto
        */
        let progresoCircuito = 0;
        let velocidadActual = 0;
        const keys = { w: false, s: false, arrowup: false, arrowdown: false };

        window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false; });

        // 1. Carga del escenario (pista de carreras)
        const loader = new THREE.GLTFLoader();
        loader.load('race_track.glb', (gltf) => {
            const pista = gltf.scene;

            // Recorrer el modelo para activar sombras
            pista.traverse((nodo) => {
                if (nodo.isMesh) {
                    nodo.castShadow = true;
                    nodo.receiveShadow = true;
                }
            });

            scene.add(pista);
            console.log("¡Pista de carreras cargada!");
        });

        // 2. Carga del coche independiente
        loader.load('lightning_mcqueen.glb', (gltf) => {
            const cocheMalla = gltf.scene;

            // Activar sombras para el coche
            cocheMalla.traverse((nodo) => {
                if (nodo.isMesh) {
                    nodo.castShadow = true;
                    nodo.receiveShadow = true;
                }
            });

            // Metemos a McQueen en nuestro grupo móvil
            grupoCoche.add(cocheMalla);
            cocheMalla.position.set(0, 0, 0);

            // Corrección de orientación si fuera necesaria
            cocheMalla.rotation.y = Math.PI;

            console.log("¡Rayo McQueen independiente cargado y acoplado!");
        });

        const panel = document.getElementById('checkpoint-panel');
        const cpTitle = document.getElementById('cp-title');
        const cpDesc = document.getElementById('cp-desc');
        const kmhLabel = document.getElementById('kmh');
        const coordsLabel = document.getElementById('coords');

        // --- 6. LOOP DE RENDIMIENTO ---
        function animate() {
            requestAnimationFrame(animate);

            // Aceleración con W/S
            const acelerando = keys.w || keys.arrowup;
            const frenando = keys.s || keys.arrowdown;

            if (acelerando) {
                velocidadActual = THREE.MathUtils.lerp(velocidadActual, 0.002, 0.04);
                progresoCircuito += velocidadActual;
            } else if (frenando) {
                velocidadActual = THREE.MathUtils.lerp(velocidadActual, -0.0015, 0.04);
                progresoCircuito += velocidadActual;
            } else {
                velocidadActual = THREE.MathUtils.lerp(velocidadActual, 0, 0.08);
                progresoCircuito += velocidadActual;
            }

            if (progresoCircuito > 1) progresoCircuito -= 1;
            if (progresoCircuito < 0) progresoCircuito += 1;

            kmhLabel.innerText = Math.round(Math.abs(velocidadActual) * 140000);

            // Mover el contenedor por la curva
            if (grupoCoche && grupoCoche.children.length > 0) {
                const posActual = trackCurve.getPointAt(progresoCircuito);
                grupoCoche.position.copy(posActual);

                // Actualizar contador de coordenadas
                coordsLabel.innerHTML = `X: ${posActual.x.toFixed(2)}<br>Y: ${posActual.y.toFixed(2)}<br>Z: ${posActual.z.toFixed(2)}`;

                let progresoAdelante = progresoCircuito + 0.003;
                if (progresoAdelante > 1) {
                    progresoAdelante = trackCurve.closed ? progresoAdelante % 1 : 1;
                }
                const puntoAdelante = trackCurve.getPointAt(progresoAdelante);

                // Solo rotar si los puntos no son exactamente el mismo
                if (posActual.distanceTo(puntoAdelante) > 0.0001) {
                    grupoCoche.lookAt(puntoAdelante);
                }

                // --- GESTIÓN DINÁMICA DE CÁMARAS ---
                const distanciaDetras = 5;
                const alturaVision = 4;

                if (!modoCamaraLibre) {
                    // MODO SEGUIR FIJO: Sigue detrás del carro rígidamente (mouse bloqueado)
                    const direccion = new THREE.Vector3().subVectors(puntoAdelante, posActual).normalize();
                    camera.position.copy(posActual).addScaledVector(direccion, -distanciaDetras);
                    camera.position.y = posActual.y + alturaVision;
                    camera.lookAt(posActual);
                } else {
                    // MODO CÁMARA LIBRE AMARRADA: Sigue la posición del carro en el espacio,
                    // pero OrbitControls hereda el mouse para que puedas arrastrar y rotar la vista
                    controls.target.copy(posActual);
                    controls.update();
                }
            }

            verificarCheckpoints();
            renderer.render(scene, camera);
        }

        function verificarCheckpoints() {
            let enZona = false;
            for (let cp of checkpoints) {
                if (progresoCircuito >= cp.progresoMin && progresoCircuito <= cp.progresoMax) {
                    enZona = true;
                    document.querySelectorAll('.sector').forEach(s => s.classList.remove('active'));
                    document.getElementById(`sec-${cp.sector}`).classList.add('active');

                    if (!panel.classList.contains('visible')) {
                        cpTitle.innerText = cp.titulo;
                        cpDesc.innerText = cp.desc;
                        panel.classList.add('visible');
                    }
                    break;
                }
            }
            if (!enZona && panel.classList.contains('visible')) {
                panel.classList.remove('visible');
            }
        }

        // Cambiar el comportamiento del mouse entre Seguir y Orbitar amarrado
        function toggleCamara() {
            modoCamaraLibre = !modoCamaraLibre;
            const btn = document.getElementById('cam-toggle');

            if (modoCamaraLibre) {
                btn.innerText = "Modo: Cámara Libre (Arrastra)";
                controls.enabled = true; // El mouse ahora puede rotar la cámara alrededor del coche
            } else {
                btn.innerText = "Modo: Seguir Coche";
                controls.enabled = false; // Bloqueamos el mouse para la vista fija trasera
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>

</html>
